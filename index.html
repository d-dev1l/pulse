<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Pulse — Catch viral content early</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --ink:#06060E;--ink2:#0D0D1F;--ink3:#13132B;
  --g:rgba(255,255,255,0.04);--g2:rgba(255,255,255,0.07);--g3:rgba(255,255,255,0.12);
  --l:rgba(255,255,255,0.07);--l2:rgba(255,255,255,0.13);--l3:rgba(255,255,255,0.22);
  --signal:#6366F1;--signal2:#818CF8;--fire:#F97316;--nova:#EC4899;--volt:#22D3EE;
  --grow:#10B981;--warn:#F59E0B;--danger:#EF4444;
  --t1:#F1F5F9;--t2:#94A3B8;--t3:#475569;
  --fd:'Syne',sans-serif;--fb:'Inter',sans-serif;--fm:'JetBrains Mono',monospace;
}
html,body{height:100%;background:var(--ink);color:var(--t1);font-family:var(--fb);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow:hidden}
button{cursor:pointer;border:none;background:none;font-family:var(--fb);color:var(--t1)}
input,select{font-family:var(--fb);color:var(--t1);outline:none}
input::placeholder{color:var(--t3)}
::-webkit-scrollbar{width:3px;height:3px}
::-webkit-scrollbar-thumb{background:var(--g3);border-radius:3px}
#app{display:grid;grid-template-columns:220px 1fr;grid-template-rows:54px 1fr;height:100vh;overflow:hidden}
#topnav{grid-column:1/-1;background:rgba(6,6,14,.97);backdrop-filter:blur(24px);border-bottom:1px solid var(--l);display:flex;align-items:center;gap:10px;padding:0 18px;z-index:100}
.logo{display:flex;align-items:center;gap:9px;font-family:var(--fd);font-weight:800;font-size:16px;letter-spacing:-.5px;width:200px;cursor:pointer;flex-shrink:0}
.logo-mark{width:30px;height:30px;background:linear-gradient(135deg,var(--signal),var(--volt));border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0}
.live-chip{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--grow);font-weight:600;white-space:nowrap}
.live-dot{width:6px;height:6px;border-radius:50%;background:var(--grow);box-shadow:0 0 8px var(--grow);animation:pulse-dot 1.5s infinite;flex-shrink:0}
.search-bar{flex:1;max-width:460px;position:relative;margin:0 auto}
.search-bar input{width:100%;background:var(--g2);border:1px solid var(--l);border-radius:9px;padding:8px 14px 8px 36px;font-size:13px;transition:border-color .2s}
.search-bar input:focus{border-color:var(--signal)}
.search-icon{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--t3);font-size:14px;pointer-events:none}
.scraper-bar{display:flex;align-items:center;gap:7px;background:rgba(99,102,241,.07);border:1px solid rgba(99,102,241,.15);border-radius:7px;padding:4px 10px;flex-shrink:0}
.spill{display:flex;align-items:center;gap:4px;padding:2px 8px;border-radius:20px;font-size:10px;font-weight:700;transition:all .3s}
.spill.ok{background:rgba(16,185,129,.12);color:#10B981}
.spill.loading{background:rgba(99,102,241,.12);color:var(--signal2);animation:blink .9s infinite}
.spill.err{background:rgba(239,68,68,.1);color:var(--danger)}
.countdown{font-size:10px;color:var(--t3);font-family:var(--fm);min-width:32px;text-align:right}
.nav-actions{margin-left:auto;display:flex;align-items:center;gap:6px}
.nav-btn{width:32px;height:32px;border-radius:8px;border:1px solid var(--l);background:var(--g);color:var(--t2);display:flex;align-items:center;justify-content:center;font-size:14px;transition:all .15s;cursor:pointer}
.nav-btn:hover{background:var(--g2);color:var(--t1)}
#sidebar{background:var(--ink2);border-right:1px solid var(--l);display:flex;flex-direction:column;overflow-y:auto;padding:14px 0}
.nav-section{font-size:10px;font-weight:700;letter-spacing:.1em;color:var(--t3);padding:10px 18px 5px;text-transform:uppercase}
.nav-item{display:flex;align-items:center;gap:9px;padding:7px 18px;cursor:pointer;color:var(--t2);font-size:12px;font-weight:500;transition:all .15s;border-left:2px solid transparent}
.nav-item:hover{color:var(--t1);background:var(--g)}
.nav-item.active{color:var(--t1);background:var(--g2);border-left-color:var(--signal)}
.nav-badge{margin-left:auto;background:var(--fire);color:#fff;font-size:9px;font-weight:700;padding:1px 6px;border-radius:20px}
.nav-hot{width:5px;height:5px;border-radius:50%;background:var(--fire);box-shadow:0 0 5px var(--fire);margin-left:auto;flex-shrink:0}
.cat-list{padding:4px 10px}
.cat-btn{display:flex;align-items:center;gap:7px;width:100%;padding:5px 8px;border-radius:7px;font-size:11px;color:var(--t2);cursor:pointer;transition:all .15s;background:transparent;text-align:left;border:none}
.cat-btn:hover{background:var(--g);color:var(--t1)}
.cat-btn.active{background:var(--g2);color:var(--t1)}
.cat-count{margin-left:auto;font-size:10px;color:var(--t3);font-family:var(--fm)}
.sidebar-footer{margin-top:auto;padding:12px 14px;border-top:1px solid var(--l)}
.up-card{background:linear-gradient(135deg,rgba(99,102,241,.15),rgba(236,72,153,.1));border:1px solid rgba(99,102,241,.25);border-radius:11px;padding:13px}
.up-card h4{font-family:var(--fd);font-size:12px;font-weight:700;margin-bottom:3px}
.up-card p{font-size:10px;color:var(--t2);margin-bottom:8px;line-height:1.5}
.up-btn{width:100%;background:linear-gradient(135deg,var(--signal),var(--nova));color:#fff;border-radius:7px;padding:7px;font-size:11px;font-weight:600;font-family:var(--fd);cursor:pointer}
#main{overflow-y:auto;background:var(--ink)}
.view{display:none;min-height:calc(100vh - 54px)}
.view.active{display:block}
.page-header{padding:22px 24px 0}
.page-title{font-family:var(--fd);font-size:22px;font-weight:800;letter-spacing:-.4px;margin-bottom:4px}
.page-title em{font-style:normal;background:linear-gradient(135deg,var(--signal2),var(--volt));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.page-sub{font-size:12px;color:var(--t2);margin-bottom:16px}
.filter-row{display:flex;align-items:center;gap:6px;padding:0 24px 16px;flex-wrap:wrap}
.ftab{padding:5px 13px;border-radius:20px;font-size:11px;font-weight:600;border:1px solid var(--l);color:var(--t2);background:var(--g);transition:all .15s;cursor:pointer}
.ftab:hover{color:var(--t1);border-color:var(--l2)}
.ftab.active{background:var(--signal);color:#fff;border-color:var(--signal)}
.fdiv{width:1px;height:18px;background:var(--l);flex-shrink:0}
.sort-sel{background:var(--g);border:1px solid var(--l);color:var(--t2);border-radius:20px;padding:4px 11px;font-size:11px;margin-left:auto;cursor:pointer}
.feed{display:flex;flex-direction:column;gap:12px;padding:0 24px 60px}
.pcard{background:var(--ink2);border:1px solid var(--l);border-radius:16px;overflow:hidden;transition:border-color .2s,box-shadow .2s;animation:fade-up .3s ease both}
.pcard:hover{border-color:var(--l2);box-shadow:0 8px 40px rgba(0,0,0,.4)}
.pcard-inner{display:grid;grid-template-columns:240px 1fr;min-height:220px}
.pmedia{position:relative;background:var(--ink3);overflow:hidden}
.pmedia-thumb{width:100%;height:100%;object-fit:cover;display:block;transition:transform .4s ease;min-height:220px}
.pcard:hover .pmedia-thumb{transform:scale(1.04)}
.pmedia-overlay{position:absolute;inset:0;background:linear-gradient(to right,transparent 50%,rgba(13,13,31,.95) 100%)}
.plat-badge{position:absolute;top:10px;left:10px;display:flex;align-items:center;gap:5px;padding:4px 9px;border-radius:20px;font-size:10px;font-weight:700;backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.15)}
.plat-badge.reddit{background:rgba(255,99,20,.2);color:#FF6314}
.plat-badge.tiktok{background:rgba(105,201,208,.15);color:#69C9D0}
.viral-rank{position:absolute;top:10px;right:10px;background:rgba(0,0,0,.75);backdrop-filter:blur(8px);border-radius:8px;padding:5px 8px;text-align:center;min-width:44px}
.viral-rank-n{font-family:var(--fd);font-size:18px;font-weight:800;line-height:1;color:var(--fire)}
.viral-rank-l{font-size:8px;color:var(--t3);margin-top:1px;text-transform:uppercase;letter-spacing:.05em}
.play-btn{position:absolute;bottom:10px;left:10px;display:flex;align-items:center;gap:6px;background:rgba(0,0,0,.75);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.18);border-radius:8px;padding:6px 11px;font-size:11px;font-weight:600;color:var(--t1);text-decoration:none;transition:all .15s}
.play-btn:hover{background:rgba(99,102,241,.5);border-color:var(--signal)}
.pdata{padding:16px 18px;display:flex;flex-direction:column}
.creator-row{display:flex;align-items:center;gap:10px;margin-bottom:11px}
.creator-avatar{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,var(--signal),var(--nova));display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;flex-shrink:0;overflow:hidden;color:#fff}
.creator-avatar img{width:100%;height:100%;object-fit:cover}
.creator-name{font-size:13px;font-weight:700;line-height:1.2}
.creator-handle{font-size:11px;color:var(--signal2);margin-top:1px}
.creator-sub{font-size:10px;color:var(--t3);margin-top:1px}
.upload-time{margin-left:auto;font-size:11px;color:var(--t3);white-space:nowrap;flex-shrink:0}
.pcaption{font-size:13px;color:var(--t1);line-height:1.5;margin-bottom:11px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pstats{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--l);border-radius:10px;overflow:hidden;margin-bottom:10px}
.pstat{background:var(--ink3);padding:8px 6px;text-align:center}
.pstat-v{font-family:var(--fm);font-size:13px;font-weight:700;color:var(--t1);display:block}
.pstat-v.fire{color:var(--fire)}
.pstat-l{font-size:9px;color:var(--t3);margin-top:2px;display:block;text-transform:uppercase;letter-spacing:.05em}
.sat-row{display:flex;align-items:center;gap:8px;margin-bottom:10px;padding:7px 10px;border-radius:8px;background:var(--g)}
.sat-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.sat-text{font-size:11px;color:var(--t2);flex:1}
.sat-label{font-size:11px;font-weight:700;white-space:nowrap}
.early-badge{background:rgba(16,185,129,.15);border:1px solid rgba(16,185,129,.3);color:#10B981;border-radius:20px;padding:2px 8px;font-size:10px;font-weight:700;flex-shrink:0}
.comments-section{border-top:1px solid var(--l);padding-top:9px;flex:1}
.comments-label{font-size:10px;font-weight:700;letter-spacing:.07em;color:var(--t3);text-transform:uppercase;margin-bottom:7px}
.comment{display:flex;gap:7px;margin-bottom:6px}
.comment-avatar{width:20px;height:20px;border-radius:50%;background:var(--ink3);border:1px solid var(--l);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:9px;color:var(--t3);font-weight:700}
.comment-body{flex:1;min-width:0}
.comment-user{font-size:10px;font-weight:700;color:var(--signal2)}
.comment-text{font-size:11px;color:var(--t2);line-height:1.4;margin-top:1px}
.comment-likes{font-size:10px;color:var(--t3);margin-top:2px}
.pcard-footer{display:flex;align-items:center;gap:8px;padding:9px 18px;border-top:1px solid var(--l);background:rgba(0,0,0,.2);flex-wrap:wrap}
.tscore-badge{display:flex;align-items:center;gap:6px;padding:4px 10px;border-radius:8px;font-size:11px;font-weight:700;border:1px solid;flex-shrink:0}
.growth-badge{font-family:var(--fm);font-size:12px;font-weight:700;color:var(--fire)}
.spacer{flex:1}
.action-btn{display:flex;align-items:center;gap:5px;padding:5px 12px;border-radius:8px;font-size:11px;font-weight:600;border:1px solid var(--l);background:var(--g);color:var(--t2);cursor:pointer;transition:all .15s;text-decoration:none;white-space:nowrap}
.action-btn:hover{background:var(--g2);color:var(--t1);border-color:var(--l2)}
.action-btn.primary{background:rgba(99,102,241,.15);border-color:rgba(99,102,241,.3);color:var(--signal2)}
.action-btn.saved{color:var(--fire);border-color:rgba(249,115,22,.3);background:rgba(249,115,22,.1)}
.skel{background:var(--ink2);border:1px solid var(--l);border-radius:16px;height:230px;position:relative;overflow:hidden}
.skel::after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.04),transparent);animation:shimmer 1.5s infinite}
.err-state{text-align:center;padding:60px 24px;color:var(--t2)}
.err-state h3{font-family:var(--fd);font-size:18px;color:var(--t1);margin-bottom:8px}
.err-state p{font-size:12px;line-height:1.7;max-width:420px;margin:0 auto 20px}
.err-state code{background:var(--g2);border:1px solid var(--l);border-radius:6px;padding:2px 8px;font-family:var(--fm);font-size:11px;color:var(--volt)}
.wl-table{background:var(--ink2);border:1px solid var(--l);border-radius:14px;overflow:hidden}
.wl-head{display:grid;grid-template-columns:2fr 100px 60px 80px 32px;gap:10px;padding:10px 16px;border-bottom:1px solid var(--l);font-size:10px;font-weight:700;color:var(--t3);text-transform:uppercase;letter-spacing:.05em}
.wl-row{display:grid;grid-template-columns:2fr 100px 60px 80px 32px;gap:10px;padding:12px 16px;border-bottom:1px solid var(--l);align-items:center;cursor:pointer;transition:background .15s}
.wl-row:last-child{border-bottom:none}
.wl-row:hover{background:var(--g)}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--ink3);border:1px solid var(--l2);border-radius:10px;padding:9px 16px;font-size:12px;color:var(--t1);z-index:9999;display:flex;align-items:center;gap:7px;animation:fade-up .25s ease both;box-shadow:0 8px 30px rgba(0,0,0,.5)}
@keyframes shimmer{0%{transform:translateX(-100%)}100%{transform:translateX(100%)}}
@keyframes pulse-dot{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.5;transform:scale(.8)}}
@keyframes fade-up{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
</style>
</head>
<body>
<div id="app">
<nav id="topnav">
  <div class="logo" onclick="showView('discover')"><div class="logo-mark">⚡</div>Pulse</div>
  <div class="live-chip"><span class="live-dot"></span><span id="live-count">Connecting…</span></div>
  <div class="search-bar">
    <span class="search-icon">🔍</span>
    <input id="searchInput" placeholder="Search creators, captions, hashtags…" oninput="applyFilters()"/>
  </div>
  <div class="scraper-bar">
    <span id="pill-reddit" class="spill loading">🟠 Reddit</span>
    <span id="pill-tiktok" class="spill loading">🎵 TikTok</span>
    <span class="countdown" id="countdown">–:––</span>
  </div>
  <div class="nav-actions">
    <button class="nav-btn" title="Refresh" onclick="forceRefresh()">↻</button>
    <button class="nav-btn" onclick="showView('watchlist')">🔖</button>
  </div>
</nav>
<aside id="sidebar">
  <div class="nav-section">Feed</div>
  <div class="nav-item active" onclick="navTo(this,'all','score')">⚡ Emerging Now <span class="nav-hot"></span></div>
  <div class="nav-item" onclick="navTo(this,'all','growth')">🔥 Fastest Growing <span class="nav-badge">LIVE</span></div>
  <div class="nav-item" onclick="navTo(this,'all','newest')">🕐 Newest First</div>
  <div class="nav-section">Source</div>
  <div class="nav-item" onclick="navTo(this,'reddit','score')">🟠 Reddit Posts</div>
  <div class="nav-item" onclick="navTo(this,'tiktok','score')">🎵 TikTok Videos</div>
  <div class="nav-item" onclick="showView('watchlist')">🔖 Watchlist</div>
  <div class="nav-section">Category</div>
  <div class="cat-list" id="catList"></div>
  <div class="sidebar-footer">
    <div class="up-card">
      <h4>Pulse Pro</h4>
      <p>Real-time alerts, export CSV, full comment threads.</p>
      <button class="up-btn">Upgrade — $29/mo</button>
    </div>
  </div>
</aside>
<div id="main">
  <div id="view-discover" class="view active">
    <div class="page-header">
      <h1 class="page-title">Catch it <em>before it peaks</em></h1>
      <p class="page-sub" id="page-sub">Loading live posts…</p>
    </div>
    <div class="filter-row">
      <button class="ftab active" onclick="setTab(this,'all','score')">All</button>
      <button class="ftab" onclick="setTab(this,'reddit','score')">🟠 Reddit</button>
      <button class="ftab" onclick="setTab(this,'tiktok','score')">🎵 TikTok</button>
      <button class="ftab" onclick="setTab(this,'all','growth')">⚡ Fastest</button>
      <button class="ftab" onclick="setTab(this,'all','newest')">🕐 Newest</button>
      <div class="fdiv"></div>
      <select class="sort-sel" onchange="activeSort=this.value;applyFilters()">
        <option value="score">Trend Score</option>
        <option value="growth">Growth Rate</option>
        <option value="newest">Newest</option>
        <option value="views">Views</option>
      </select>
    </div>
    <div class="feed" id="feed"></div>
  </div>
  <div id="view-watchlist" class="view">
    <div style="padding:24px">
      <h1 style="font-family:var(--fd);font-size:22px;font-weight:800;margin-bottom:6px">Watchlist</h1>
      <p style="color:var(--t2);font-size:13px;margin-bottom:20px" id="wl-count">0 posts saved</p>
      <div id="wl-inner"></div>
    </div>
  </div>
</div>
</div>
<script>
const REFRESH_MS = 15 * 60 * 1000;
const CATS=[{e:'🔥',n:'All'},{e:'🤖',n:'AI'},{e:'⚡',n:'Technology'},{e:'💰',n:'Finance'},{e:'🎮',n:'Gaming'},{e:'🎬',n:'Entertainment'},{e:'🍕',n:'Food'},{e:'🔬',n:'Science'},{e:'🏆',n:'Sports'}];

let ALL=[], watchlist=JSON.parse(localStorage.getItem('pulse_wl')||'[]');
let activeCat='All', activeSource='all', activeSort='score';
let nextRefreshAt=0, cdTimer=null;

const fmt=n=>n>=1e6?(n/1e6).toFixed(1)+'M':n>=1000?(n/1000).toFixed(1)+'K':String(n||0);
const since=iso=>{const s=(Date.now()-new Date(iso))/1000;return s<60?'just now':s<3600?Math.round(s/60)+'m ago':s<86400?Math.round(s/3600)+'h ago':Math.round(s/86400)+'d ago';};
const scoreColor=s=>s>=88?'var(--fire)':s>=72?'var(--warn)':s>=55?'var(--grow)':'var(--volt)';
const toast=msg=>{const el=document.createElement('div');el.className='toast';el.textContent='✓ '+msg;document.body.appendChild(el);setTimeout(()=>el.remove(),2200);};
const saveWl=()=>localStorage.setItem('pulse_wl',JSON.stringify(watchlist));
const catThumb=cat=>({AI:'https://images.unsplash.com/photo-1677442135703-1787eea5ce01?w=500&q=75',Technology:'https://images.unsplash.com/photo-1518770660439-4636190af475?w=500&q=75',Finance:'https://images.unsplash.com/photo-1611974789855-9c2a0a7236a3?w=500&q=75',Gaming:'https://images.unsplash.com/photo-1538481199705-c710c4e965fc?w=500&q=75',Food:'https://images.unsplash.com/photo-1512621776951-a57141f2eefd?w=500&q=75',Science:'https://images.unsplash.com/photo-1532094349884-543559c98d1c?w=500&q=75',Entertainment:'https://images.unsplash.com/photo-1489599849927-2ee91cede3ba?w=500&q=75',Sports:'https://images.unsplash.com/photo-1461896836934-ffe607ba8211?w=500&q=75'}[cat]||'https://images.unsplash.com/photo-1557804506-669a67965ba0?w=500&q=75');

// ── Supabase config (public anon key — safe to expose, RLS enforces read-only) ──
const SB_URL = 'https://abpedxaniaqkxvlyypnt.supabase.co';
const SB_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFicGVkeGFuaWFxa3h2bHl5cG50Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYwNTM3ODUsImV4cCI6MjEwMTYyOTc4NX0.wcpW2EzTI4gGbOes5i0UTypyDpddFeV9CuZ5QSMqVZU';
// Convert a Supabase trends row → the card schema the UI already expects
function rowToPost(r) {
  const platform = r.source === 'youtube' ? 'youtube'
    : r.source === 'instagram' ? 'instagram'
    : 'tiktok';

  const ageH = r.published_at
    ? Math.max(0.1, (Date.now() - new Date(r.published_at)) / 3_600_000)
    : 0;

  const bucket = r.age_bucket || 'UNKNOWN';
  const bucketLabel = bucket === 'HOT' ? '🔥 HOT'
    : bucket === 'EARLY' ? '🟢 EARLY'
    : bucket === 'RISING' ? '🟢 RISING'
    : bucket === 'WATCH' ? '🟡 WATCH'
    : bucket === 'HISTORICAL' ? '⬜ Historical'
    : '⬜ Archived';

  const growthRate = ageH > 0 ? Math.round(r.views / Math.max(ageH, 0.1)) : 0;

  return {
    id:             r.id,
    platform,
    source:         r.source,
    source_type:    r.source_type,
    discovery_method: r.discovery_method,
    category:       r.category || 'Technology',
    creator_name:   r.creator_name || r.creator_username || 'Unknown',
    creator_handle: '@' + (r.creator_username || 'unknown'),
    creator_avatar: null,
    caption:        r.title || r.caption || '',
    thumbnail:      r.thumbnail_url || catThumb(r.category),
    url:            r.url,
    views:          r.views || 0,
    upvotes:        r.likes || 0,
    likes:          r.likes || 0,
    comments:       r.comments || 0,
    shares:         r.shares || 0,
    trend_score:    Number(r.trend_score) || 0,
    age_bucket:     bucket,
    age_label:      bucketLabel,
    is_emerging:    r.is_emerging,
    growth_rate:    growthRate,
    growth_label:   '+' + (growthRate >= 1000 ? (growthRate/1000).toFixed(1)+'K' : growthRate) + '/hr',
    posted_at:      r.published_at,
    top_comments:   [],
    sat: {
      label: bucketLabel,
      color: bucket==='HOT' ? '#EF4444'
        : bucket==='EARLY' ? '#10B981'
        : bucket==='RISING' ? '#3B82F6'
        : bucket==='WATCH' ? '#F59E0B'
        : 'var(--t3)',
      tip: bucket==='HOT' ? 'Posted in the last 6 hours'
        : bucket==='EARLY' ? '6–24 hours old'
        : bucket==='RISING' ? '1–3 days old, still growing'
        : bucket==='WATCH' ? '3–7 days — monitor velocity'
        : 'Historical content',
    },
  };
}

async function fetchFromSupabase(source) {
  const url = new URL(`${SB_URL}/rest/v1/trends`);
  url.searchParams.set('select', '*');
  url.searchParams.set('status', 'eq.active');
  if (source) url.searchParams.set('source', `eq.${source}`);
  // Emerging Now: only is_emerging=true; Historical: all
  if (activeView === 'emerging') url.searchParams.set('is_emerging', 'eq.true');
  url.searchParams.set('order', 'trend_score.desc,published_at.desc');
  url.searchParams.set('limit', '100');

  const res = await fetch(url.toString(), {
    headers: {
      'apikey': SB_ANON,
      'Authorization': 'Bearer ' + SB_ANON,
      'Content-Type': 'application/json',
    }
  });
  if (!res.ok) throw new Error('Supabase ' + res.status);
  const rows = await res.json();
  return rows.map(rowToPost);
}

let activeView = 'emerging'; // 'emerging' | 'all'

async function runScrapers() {
  document.getElementById('feed').innerHTML = Array(6).fill('<div class="skel"></div>').join('');

  try {
    const [youtube, tiktok, instagram] = await Promise.allSettled([
      fetchFromSupabase('youtube'),
      fetchFromSupabase('tiktok'),
      fetchFromSupabase('instagram'),
    ]);

    const yt  = youtube.status  === 'fulfilled' ? youtube.value  : [];
    const tt  = tiktok.status   === 'fulfilled' ? tiktok.value   : [];
    const ig  = instagram.status === 'fulfilled' ? instagram.value : [];

    const seen = new Set();
    ALL = [...tt, ...ig, ...yt].filter(p => {
      if (seen.has(p.id)) return false;
      seen.add(p.id); return true;
    });

    const emerging = ALL.filter(p => p.is_emerging).length;
    const sourceLabel = `YouTube: ${yt.length} · TikTok: ${tt.length} · Instagram: ${ig.length}`;
    document.getElementById('live-count').textContent = `Live · ${ALL.length} posts (${sourceLabel})`;
    document.getElementById('page-sub').textContent = `${ALL.length} trends · ${emerging} emerging · Updated ${new Date().toLocaleTimeString()}`;

    // Update header pills
    const rPill = document.getElementById('pill-reddit');
    const tPill = document.getElementById('pill-tiktok');
    if (rPill) { rPill.textContent = `📺 YouTube ${yt.length}`; rPill.className = 'spill ok'; }
    if (tPill) { tPill.textContent = `🎵 TikTok+IG ${tt.length + ig.length}`; tPill.className = 'spill ok'; }

    if (ALL.length === 0) {
      document.getElementById('feed').innerHTML = `<div class="err-state">
        <h3>⚠ No trends loaded</h3>
        <p style="margin-top:12px">Collectors are running. Data appears every 15–120 minutes depending on source.</p>
      </div>`;
      return;
    }
    applyFilters(); renderCats();

  } catch(e) {
    console.error('Supabase fetch error:', e.message);
    document.getElementById('feed').innerHTML = `<div class="err-state">
      <h3>⚠ Could not load trends</h3>
      <p style="font-size:11px;color:var(--t3);margin-top:8px">${e.message}</p>
    </div>`;
  }
}

function applyFilters(){
  let f=[...ALL];
  if(activeSource!=='all')f=f.filter(p=>p.source===activeSource||p.platform===activeSource);
  if(activeCat!=='All')f=f.filter(p=>p.category===activeCat);
  const q=document.getElementById('searchInput').value.trim().toLowerCase();
  if(q)f=f.filter(p=>p.caption?.toLowerCase().includes(q)||p.creator_handle?.toLowerCase().includes(q)||p.category?.toLowerCase().includes(q));
  if(activeSort==='growth')f.sort((a,b)=>b.growth_rate-a.growth_rate);
  else if(activeSort==='newest')f.sort((a,b)=>new Date(b.posted_at||b.posted_at)-new Date(a.posted_at||a.posted_at));
  else if(activeSort==='views')f.sort((a,b)=>b.views-a.views);
  else f.sort((a,b)=>b.trend_score-a.trend_score);
  renderFeed(f);
}

function renderFeed(posts){
  const feed=document.getElementById('feed');
  if(!posts.length){feed.innerHTML='<p style="color:var(--t2);padding:40px 0;text-align:center">No posts match this filter.</p>';return;}
  feed.innerHTML=posts.map((p,i)=>renderCard(p,i)).join('');
}

function renderCard(p,idx){
  const sc=scoreColor(p.trend_score);
  const inWl=watchlist.some(w=>w.id===p.id);
  const sat=p.sat||{label:'—',color:'var(--t3)',tip:'—'};
  const initials=(p.creator_name||'UN').replace('@','').slice(0,2).toUpperCase();
  const cmts=(p.top_comments||[]).length
    ?(p.top_comments).slice(0,3).map(c=>`<div class="comment"><div class="comment-avatar">${(c.user||'?').replace(/[^a-zA-Z]/g,'').slice(0,2).toUpperCase()||'?'}</div><div class="comment-body"><div class="comment-user">${c.user}</div><div class="comment-text">"${c.text}"</div><div class="comment-likes">▲ ${fmt(c.likes)}</div></div></div>`).join('')
    :'<div style="font-size:11px;color:var(--t3)">No comments fetched</div>';
  return`<div class="pcard" style="animation-delay:${Math.min(idx,12)*.05}s">
  <div class="pcard-inner">
    <div class="pmedia">
      <img class="pmedia-thumb" src="${p.thumbnail||catThumb(p.category)}" alt="" loading="lazy" onerror="this.src='${catThumb(p.category)}'"/>
      <div class="pmedia-overlay"></div>
      <div class="plat-badge ${p.source||p.platform}">${
        p.source==='youtube'?'📺 YouTube':
        p.source==='instagram'?'📸 Instagram':
        p.source==='tiktok'?'🎵 TikTok':
        p.platform==='reddit'?'🟠 HN':'🎵 TikTok'
      }${p.age_bucket==='HOT'?' 🔥':p.age_bucket==='EARLY'?' 🟢':''}</div>
      <div class="viral-rank"><div class="viral-rank-n">#${idx+1}</div><div class="viral-rank-l">Rank</div></div>
      <a href="${p.url}" target="_blank" rel="noopener" class="play-btn">${
        p.source==='tiktok'?'▶ Watch':
        p.source==='youtube'?'▶ YouTube':
        p.source==='instagram'?'▶ Instagram':
        '↗ Open'
      }</a>
    </div>
    <div class="pdata">
      <div class="creator-row">
        <div class="creator-avatar">${p.creator_avatar?`<img src="${p.creator_avatar}" alt="" onerror="this.parentElement.textContent='${initials}'">`:initials}</div>
        <div style="min-width:0;flex:1">
          <div class="creator-name">${p.creator_name||p.creator_handle}</div>
          <div class="creator-handle">${p.creator_handle}</div>
          ${p.subreddit?`<div class="creator-sub">r/${p.subreddit}${p.flair?' · '+p.flair:''}</div>`:''}
        </div>
        <div class="upload-time">${since(p.posted_at)}</div>
      </div>
      <div class="pcaption">${p.caption}</div>
      <div class="pstats">
        <div class="pstat"><span class="pstat-v">${fmt(p.views)}</span><span class="pstat-l">${p.platform==='reddit'?'Upvotes':'Views'}</span></div>
        <div class="pstat"><span class="pstat-v fire">${p.growth_label}</span><span class="pstat-l">Growth</span></div>
        <div class="pstat"><span class="pstat-v">${fmt(p.likes||p.upvotes)}</span><span class="pstat-l">Likes</span></div>
        <div class="pstat"><span class="pstat-v">${fmt(p.comments)}</span><span class="pstat-l">Comments</span></div>
      </div>
      <div class="sat-row">
        <div class="sat-dot" style="background:${sat.color}"></div>
        <div class="sat-text">${sat.tip}</div>
        <span class="sat-label" style="color:${sat.color}">${sat.label}</span>
        ${p.is_early?'<span class="early-badge">⚡ EARLY</span>':''}
      </div>
      <div class="comments-section">
        <div class="comments-label">💬 Top comments</div>
        ${cmts}
      </div>
    </div>
  </div>
  <div class="pcard-footer">
    <div class="tscore-badge" style="color:${sc};border-color:${sc};background:${sc}18">
      <span style="font-family:var(--fm);font-size:15px;font-weight:800">${p.trend_score}</span>
      <span style="font-size:10px;color:var(--t3);font-weight:400">score</span>
    </div>
    <div class="growth-badge">${p.growth_label}</div>
    <span style="font-size:11px;color:var(--t3)">${p.category}</span>
    <div class="spacer"></div>
    <a href="${p.url}" target="_blank" rel="noopener" class="action-btn primary">${p.platform==='tiktok'?'▶ Watch Video':'↗ Open Post'}</a>
    <button class="action-btn ${inWl?'saved':''}" onclick="toggleWl('${p.id}',this)">🔖 ${inWl?'Saved':'Save'}</button>
    <button class="action-btn" onclick="navigator.clipboard?.writeText('${p.url}');toast('Copied!')">⎘ Copy</button>
  </div>
</div>`;
}

function setStatus(src,st){const el=document.getElementById('pill-'+src);if(!el)return;el.className='spill '+st;el.textContent={ok:'✓ ',loading:'⟳ ',err:'✕ '}[st]+(src==='reddit'?'Reddit':'TikTok');}
function startCountdown(){if(cdTimer)clearInterval(cdTimer);nextRefreshAt=Date.now()+REFRESH_MS;cdTimer=setInterval(()=>{const rem=Math.max(0,nextRefreshAt-Date.now());const m=Math.floor(rem/60000),s=Math.floor((rem%60000)/1000);const el=document.getElementById('countdown');if(el)el.textContent=`${m}:${s.toString().padStart(2,'0')}`;if(rem<=0){nextRefreshAt=Date.now()+REFRESH_MS;runScrapers();}},1000);}
async function forceRefresh(){nextRefreshAt=Date.now()+REFRESH_MS;toast('Refreshing…');await runScrapers();}
function toggleWl(id,btn){const p=ALL.find(x=>x.id===id);if(!p)return;const idx=watchlist.findIndex(w=>w.id===id);if(idx>=0){watchlist.splice(idx,1);toast('Removed');}else{watchlist.push(p);toast('Saved!');}saveWl();if(btn){btn.className='action-btn '+(idx>=0?'':'saved');btn.textContent='🔖 '+(idx>=0?'Save':'Saved');}if(document.getElementById('view-watchlist').classList.contains('active'))renderWatchlist();}
function renderWatchlist(){document.getElementById('wl-count').textContent=watchlist.length+' post'+(watchlist.length!==1?'s':'')+' saved';const el=document.getElementById('wl-inner');if(!watchlist.length){el.innerHTML='<div style="text-align:center;padding:60px 20px;color:var(--t2)"><div style="font-size:48px;margin-bottom:12px">🔖</div><p>Nothing saved yet</p></div>';return;}el.innerHTML=`<div class="wl-table"><div class="wl-head"><span>Post</span><span>Creator</span><span>Plat</span><span>Score</span><span></span></div>${watchlist.map(p=>`<div class="wl-row" onclick="window.open('${p.url}','_blank','noopener')"><div><div style="font-size:12px;font-weight:600;margin-bottom:2px">${p.caption.slice(0,60)}…</div><div style="font-size:10px;color:var(--t3)">${since(p.posted_at)} · ${p.growth_label}</div></div><div style="font-size:11px;color:var(--signal2)">${p.creator_handle}</div><div>${p.platform==='reddit'?'🟠':'🎵'}</div><span style="font-family:var(--fm);font-size:12px;font-weight:700;color:${scoreColor(p.trend_score)}">${p.trend_score}</span><button onclick="event.stopPropagation();toggleWl('${p.id}',null)" style="color:var(--t3);font-size:12px;background:var(--g);border:1px solid var(--l);border-radius:6px;width:26px;height:26px;display:flex;align-items:center;justify-content:center;cursor:pointer">✕</button></div>`).join('')}</div>`;}
function renderCats(){document.getElementById('catList').innerHTML=CATS.map(c=>`<button class="cat-btn ${c.n===activeCat?'active':''}" onclick="filterCat('${c.n}',this)">${c.e} ${c.n}<span class="cat-count">${c.n==='All'?ALL.length:ALL.filter(p=>p.category===c.n).length}</span></button>`).join('');}
function filterCat(n,el){activeCat=n;document.querySelectorAll('.cat-btn').forEach(b=>b.classList.remove('active'));el.classList.add('active');applyFilters();}
function setTab(el,src,sort){document.querySelectorAll('.ftab').forEach(b=>b.classList.remove('active'));el.classList.add('active');activeSource=src;activeSort=sort;applyFilters();}
function navTo(el,src,sort){document.querySelectorAll('.nav-item').forEach(n=>n.classList.remove('active'));el.classList.add('active');activeSource=src;activeSort=sort;showView('discover');}
function showView(n){document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));document.getElementById('view-'+n)?.classList.add('active');if(n==='watchlist')renderWatchlist();document.getElementById('main').scrollTop=0;}

async function init(){renderCats();await runScrapers();startCountdown();}
init();
</script>
